[package]
name = "gitalator"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Persistent federated Git workspaces"

[[bin]]
name = "gtl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fuser = { version = "0.14", default-features = false, features = ["abi-7-31"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
fuser = { path = "vendor/fuser" }
